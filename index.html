<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hdr-bar">
    <h1 class="app-title">2048</h1>
    <div class="top-controls">
      <div class="score-bl">
        <div class="lbl">Счёт</div>
        <div id="scoreVal" class="val">0</div>
      </div>
      <div class="score-bl best">
        <div class="lbl">Лучший</div>
        <div id="bestVal" class="val">0</div>
      </div>
      <div class="btns">
        <button id="undoBtn" title="Отменить ход">Undo</button>
        <button id="newBtn" title="Новая игра">New</button>
        <button id="leadersBtn" title="Таблица лидеров">Leaders</button>
      </div>
    </div>
  </header>

  <main>
    <section id="wrapBoard" class="wrap-board">
      <div id="boardGrid" class="grid" aria-label="Поле 2048" role="application"></div>
      <div id="overlayGameOver" class="overlay hidden" role="dialog" aria-modal="true">
        <div class="box">
          <p id="gameOverMsg">Игра окончена</p>
          <label for="nameInput">Введите имя для лидеров:</label>
          <input id="nameInput" type="text" maxlength="20" placeholder="Имя">
          <div class="actions">
            <button id="restartBtn">Начать заново</button>
          </div>
          <p id="savedNote" class="saved-note hidden">Ваш рекорд сохранён</p>
        </div>
      </div>
    </section>

    <nav id="mobileNav" class="mobile-controls hidden" aria-hidden="true">
      <button data-dir="up" class="m-btn">↑</button>
      <div class="m-row">
        <button data-dir="left" class="m-btn">←</button>
        <button data-dir="down" class="m-btn">↓</button>
        <button data-dir="right" class="m-btn">→</button>
      </div>
    </nav>
  </main>

  <div id="leadersModal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="box">
      <h2>Таблица лидеров (топ-10)</h2>
      <table class="leaderboard">
        <thead><tr><th>Место</th><th>Имя</th><th>Очки</th><th>Дата</th></tr></thead>
        <tbody id="leadersBody"></tbody>
      </table>
      <div class="actions">
        <button id="clearLeadersBtn">Очистить</button>
        <button id="closeLeadersBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <footer class="foot">Управляй стрелками, свайпами или виртуальными кнопками</footer>

  <script src="script.js"></script>
</body>
</html>
